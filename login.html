<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - BookBot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="arado-page arado-auth-page">
  <header class="arado-site-header">
    <div class="arado-top-strip">
      <div class="arado-container arado-strip-links">
        <a href="signup.html">Sign Up</a>
        <a href="login.html">Log In</a>
      </div>
    </div>

    <div class="arado-brand-row">
      <div class="arado-container arado-brand-content">
        <div class="arado-search muted" aria-hidden="true">
          <span class="arado-search-button"></span>
          <span class="arado-search-placeholder">BookBot Library</span>
        </div>

        <a class="arado-brand" href="index.html" aria-label="BookBot home">
          <span class="arado-brand-copy">
            <strong>BookBot Library</strong>
            <small>Secure access for readers and admins</small>
          </span>
          <span class="arado-logo-mark" aria-hidden="true">BB</span>
        </a>
      </div>
    </div>

    <nav class="arado-nav-bar" aria-label="Main navigation">
      <div class="arado-container arado-nav-content">
        <a class="arado-home-tile" href="index.html" aria-label="Home"></a>
        <a href="library.html">Search Books</a>
        <a href="signup.html">New Account</a>
      </div>
    </nav>
  </header>

  <main class="arado-auth-shell">
    <section class="auth-card arado-auth-card" aria-labelledby="loginTitle">
      <p class="eyebrow">BookBot</p>
      <h1 id="loginTitle">Log in</h1>
      <form class="auth-form" id="loginForm">
        <label>
          <span>Email</span>
          <input id="emailInput" type="email" autocomplete="email" required>
        </label>
        <label>
          <span>Password</span>
          <input id="passwordInput" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary" type="submit">Log In</button>
      </form>
      <div class="status-line" id="authStatus" role="status" aria-live="polite"></div>
      <p class="auth-switch">No account? <a href="signup.html">Sign up</a></p>
    </section>
  </main>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
