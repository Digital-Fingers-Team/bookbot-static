<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - BookBot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="signupTitle">
      <p class="eyebrow">BookBot</p>
      <h1 id="signupTitle">Sign up</h1>
      <form class="auth-form" id="signupForm">
        <label>
          <span>Name</span>
          <input id="nameInput" type="text" autocomplete="name" required>
        </label>
        <label>
          <span>Email</span>
          <input id="emailInput" type="email" autocomplete="email" required>
        </label>
        <label>
          <span>Password</span>
          <input id="passwordInput" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <button class="primary" type="submit">Create Account</button>
      </form>
      <div class="status-line" id="authStatus" role="status" aria-live="polite"></div>
      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
